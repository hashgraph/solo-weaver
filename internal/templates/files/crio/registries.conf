# SPDX-License-Identifier: Apache-2.0
# CRI-O registry configuration for caching Kubernetes images
# This file configures CRI-O to use a local pull-through cache for registry.k8s.io

# Keep exactly one entry: CRI-O 1.34 and later refuses a short image name
# (for example "maven:3") that more than one of these registries could serve.
unqualified-search-registries = ["docker.io"]

# Mirror configuration for registry.k8s.io
[[registry]]
location = "registry.k8s.io"
prefix = "registry.k8s.io"
insecure = false
blocked = false

# Use local registry mirror as primary source (via SSH tunnel in VM)
[[registry.mirror]]
location = "{{.ContainerRegistryProxy}}"
insecure = true

