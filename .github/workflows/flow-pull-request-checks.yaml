# SPDX-License-Identifier: Apache-2.0

name: "PR Checks"
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

defaults:
  run:
    shell: bash

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: solo-linux-medium
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    uses: ./.github/workflows/zxc-code-compiles.yaml
    secrets: inherit
    with:
      custom-job-label: Standard

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/zxc-unit-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: Standard

  # The VM jobs (integration and UAT) do not run on every push. They run on
  # demand: see flow-test-full.yaml. The "Full VM Tests Gate" check that tracks
  # them is its own workflow, flow-full-vm-gate.yaml.
