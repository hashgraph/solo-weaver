# SPDX-License-Identifier: Apache-2.0

name: "PR Checks"
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

defaults:
  run:
    shell: bash

# Label events for labels other than skip-kvm-runner get a unique group so they
# never cancel an in-flight run.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'skip-kvm-runner' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    if: >
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'skip-kvm-runner'
    runs-on: solo-linux-medium
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    uses: ./.github/workflows/zxc-code-compiles.yaml
    secrets: inherit
    with:
      custom-job-label: Standard

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/zxc-unit-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: Standard

  uat-compat:
    name: UAT Backward Compatibility
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
      - unit-tests
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: UAT Compat
      uat-scenario: compat
      vm-os: debian
      vm-cpus: 2

  uat-core:
    name: UAT Core Lifecycle
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
      - unit-tests
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: UAT Core
      uat-scenario: lifecycle
      vm-os: debian
      vm-cpus: 2

  uat-purge-storage:
    name: UAT Purge Storage
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
      - unit-tests
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: UAT Purge Storage
      uat-scenario: purge-storage
      vm-os: debian
      vm-cpus: 2

  uat-plugin-preset-upgrade:
    name: UAT Plugin Preset Upgrade
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
      - unit-tests
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: UAT Plugin Preset Upgrade
      uat-scenario: plugin-preset-upgrade
      vm-os: debian
      vm-cpus: 2

  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/zxc-integration-test.yaml
    secrets: inherit
    needs:
      - changes
      - build
    if: needs.changes.outputs.non_docs == 'true'
    with:
      custom-job-label: Standard
      vm-os: debian
