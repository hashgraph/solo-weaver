---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ .Name }}"
  namespace: "{{ .Namespace }}"
spec:
  refreshInterval: "{{ .RefreshInterval }}"
  secretStoreRef:
    name: "{{ .StoreName }}"
    kind: ClusterSecretStore
  target:
    name: "{{ .Name }}"
    creationPolicy: Owner
  data:
{{- range .Data }}
    - secretKey: "{{ .SecretKey }}"
      remoteRef:
        key: "{{ .RemoteKey }}"
{{- if .Property }}
        property: "{{ .Property }}"
{{- end }}
{{- end }}
