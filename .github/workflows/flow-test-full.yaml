# SPDX-License-Identifier: Apache-2.0

name: "Full VM Tests"
on:
  workflow_dispatch:
    inputs:
      vm-os:
        description: "VM OS to test"
        required: true
        default: "debian"
        type: choice
        options:
          - debian
          - ubuntu
      run-integration:
        description: "Run Integration Tests"
        type: boolean
        default: true
      run-compat:
        description: "Run UAT Backward Compatibility"
        type: boolean
        default: true
      run-lifecycle:
        description: "Run UAT Core Lifecycle"
        type: boolean
        default: true
      run-purge-storage:
        description: "Run UAT Purge Storage"
        type: boolean
        default: true
      run-plugin-preset-upgrade:
        description: "Run UAT Plugin Preset Upgrade"
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A newer dispatch on the same branch supersedes an older one of the same kind:
# the older run is for a commit that is no longer the branch head. Full and
# partial runs are separate kinds, so a diagnostic partial run never cancels a
# full run that is still going.
concurrency:
  group: full-vm-tests-${{ github.ref }}-${{ (inputs.run-integration && inputs.run-compat && inputs.run-lifecycle && inputs.run-purge-storage && inputs.run-plugin-preset-upgrade) && 'full' || 'partial' }}
  cancel-in-progress: true

# Runs the same VM jobs the PR Checks workflow used to run on every push. Run it
# from the branch to validate (the top PR of a stack):
#
#   gh workflow run flow-test-full.yaml --ref <branch>
#
# The "Full VM Tests Gate" job in PR Checks passes once one run of this workflow
# has succeeded, with all five jobs passing, for the PR's current head commit.
# Switching jobs off (for example to re-test a single failed scenario) is for
# diagnosis: a run with a job skipped does not satisfy the gate. To retry a
# failed job of a full run, use "Re-run failed jobs" on that run.
#
# The five job names below are matched by prefix in the gate (flow-pull-request-
# checks.yaml). Keep the two in sync.
jobs:
  # With every job switched off the run would skip everything and still end
  # green, which looks like a pass but tested nothing. Fail it instead.
  validate-inputs:
    name: Validate inputs
    runs-on: solo-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Require at least one job
        env:
          RUN_INTEGRATION: ${{ inputs.run-integration }}
          RUN_COMPAT: ${{ inputs.run-compat }}
          RUN_LIFECYCLE: ${{ inputs.run-lifecycle }}
          RUN_PURGE_STORAGE: ${{ inputs.run-purge-storage }}
          RUN_PLUGIN_PRESET_UPGRADE: ${{ inputs.run-plugin-preset-upgrade }}
        run: |
          set -euo pipefail
          for selected in "${RUN_INTEGRATION}" "${RUN_COMPAT}" "${RUN_LIFECYCLE}" "${RUN_PURGE_STORAGE}" "${RUN_PLUGIN_PRESET_UPGRADE}"; do
            if [ "${selected}" = "true" ]; then
              exit 0
            fi
          done
          echo "::error::No job is selected, so this run would test nothing. Tick at least one of: run-integration, run-compat, run-lifecycle, run-purge-storage, run-plugin-preset-upgrade."
          exit 1

  integration-tests:
    name: Integration Tests
    if: inputs.run-integration
    uses: ./.github/workflows/zxc-integration-test.yaml
    secrets: inherit
    with:
      custom-job-label: Standard
      vm-os: ${{ inputs.vm-os }}

  uat-compat:
    name: UAT Backward Compatibility
    if: inputs.run-compat
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    with:
      custom-job-label: UAT Compat
      uat-scenario: compat
      vm-os: ${{ inputs.vm-os }}
      vm-cpus: 2

  uat-core:
    name: UAT Core Lifecycle
    if: inputs.run-lifecycle
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    with:
      custom-job-label: UAT Core
      uat-scenario: lifecycle
      vm-os: ${{ inputs.vm-os }}
      vm-cpus: 2

  uat-purge-storage:
    name: UAT Purge Storage
    if: inputs.run-purge-storage
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    with:
      custom-job-label: UAT Purge Storage
      uat-scenario: purge-storage
      vm-os: ${{ inputs.vm-os }}
      vm-cpus: 2

  uat-plugin-preset-upgrade:
    name: UAT Plugin Preset Upgrade
    if: inputs.run-plugin-preset-upgrade
    uses: ./.github/workflows/zxc-uat-test.yaml
    secrets: inherit
    with:
      custom-job-label: UAT Plugin Preset Upgrade
      uat-scenario: plugin-preset-upgrade
      vm-os: ${{ inputs.vm-os }}
      vm-cpus: 2

  # The gate in PR Checks ran when the PR was pushed, before this run existed,
  # so it is red. Once everything here has passed, re-run just that job so it
  # picks up the result. Best effort: a failure here is only a warning. This
  # job is skipped, by design, when any job above was switched off.
  recheck-gate:
    name: Re-check PR gate
    needs:
      - integration-tests
      - uat-compat
      - uat-core
      - uat-purge-storage
      - uat-plugin-preset-upgrade
    runs-on: solo-linux-medium
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Re-run the Full VM Tests Gate job
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'flow-pull-request-checks.yaml',
                head_sha: context.sha,
                event: 'pull_request',
                per_page: 100,
              });
              const latest = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!latest) {
                core.notice('No PR Checks run for this commit, so there is no gate to re-check.');
                return;
              }
              if (latest.status !== 'completed') {
                core.notice(`PR Checks run ${latest.html_url} is still ${latest.status}. Re-run its "Full VM Tests Gate" job once it finishes.`);
                return;
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: latest.id,
                filter: 'latest',
                per_page: 100,
              });
              const gate = jobs.find((j) => j.name === 'Full VM Tests Gate');
              if (!gate || gate.conclusion !== 'failure') {
                core.notice('The gate job is not failed (it passed, was skipped, or does not exist), so nothing to re-run.');
                return;
              }
              await github.rest.actions.reRunJobForWorkflowRun({ owner, repo, job_id: gate.id });
              core.notice(`Re-ran the gate job: ${latest.html_url}`);
            } catch (error) {
              core.warning(`Could not re-run the gate job automatically: ${error.message}. Re-run it from the PR Checks run.`);
            }
