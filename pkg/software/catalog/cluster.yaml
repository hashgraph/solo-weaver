- name: solo-operator
  type: oci
  # Private registry. The host must have ghcr credentials in Helm's registry config
  # before install: `task registry:login:ghcr` (writes them from the root .env).
  # Public charts also work with no login.
  chart: 'oci://ghcr.io/hashgraph/solo-operator/solo-operator-chart'
  namespace: 'solo-operator'
  release: 'solo-operator'
  # The solo-operator version is owned by deps.SOLO_OPERATOR_VERSION (pkg/deps),
  # the single source of truth shared with the UC sidecar tag. The catalog default
  # is injected from it at load time (pkg/software/catalog_loader.go), so there is NO
  # `default:` here — only the checksum for the active version below, regenerated by
  # `task bump:solo-operator VERSION=x`. The version key must equal
  # deps.SOLO_OPERATOR_VERSION or the catalog fails to load.
  versions:
    0.10.0:
      algorithm: 'sha256'
      # Private chart — regenerate with `task registry:login:ghcr && task chart-checksums`.
      checksum: 'da26976fcf9b3e32e086f53f733a08a54a6d89075cf431465de85b4d50396d9a'
