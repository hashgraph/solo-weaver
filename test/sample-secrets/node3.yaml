# SPDX-License-Identifier: Apache-2.0
# Sample consensus-node secrets for node3 — manual testing ONLY.
# Test key material (self-signed, non-production); namespace hiero-network-1.
# The two secrets a consensus node requires: gossip signing keys and the
# gRPC TLS key/cert (matches docs/example).
# Apply with: task uat:consensus:secrets   (or kubectl apply -f this file)
kind: Secret
apiVersion: v1
metadata:
  name: node3-gossip-keys
  namespace: hiero-network-1
  labels:
    app: consensus-node
    consensus-capsule: node3
    key-type: gossip
    app.kubernetes.io/component: secret
    app.kubernetes.io/managed-by: solo-operator
data:
  # Example/test private key for local development only — not a real secret # wiz-ignore # gitleaks:allow # pragma: allowlist secret
  private.pem: 
  public.pem: 
---
kind: Secret
apiVersion: v1
metadata:
  name: node3-grpc-tls-keys
  namespace: hiero-network-1
  labels:
    app: consensus-node
    consensus-capsule: node3
    key-type: grpc-tls
    app.kubernetes.io/component: secret
    app.kubernetes.io/managed-by: solo-operator
data:
  hedera-node3.crt: 
  # Example/test private key for local development only — not a real secret # wiz-ignore # gitleaks:allow # pragma: allowlist secret
  hedera-node3.key: 
