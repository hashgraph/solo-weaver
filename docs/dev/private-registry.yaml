# SPDX-License-Identifier: Apache-2.0
#
# In-cluster private Docker registry for UAT (acceptance-tests.md §G6 — a
# security patch published only to a private registry). Mirrors the shape of
# solo-operator/test/consensus-mock/kind/registry.yaml and adds basic auth so
# the UAT can verify weaver routes the correct pull secret per registry host.
#
# NOT for production. Plain HTTP + a known-weak test credential — fine for a
# throwaway UAT, nothing else.
#
# How addresses line up:
#   In-cluster pulls (operator probe, kubelet):  10.96.100.100:5000
#   Host-side push (via kubectl port-forward):   localhost:5001
#
# Prereqs for the kubelet pull to work on the UTM VM:
#   containerd must allow HTTP for 10.96.100.100:5000. See acceptance-tests.md
#   §G6 for the one-time containerd config step and the reset.
#
# Credentials (regenerate with `htpasswd -Bbn uatuser <newpass>`):
#   username = uatuser
#   password = uatpass
# The htpasswd line below is bcrypt-hashed (cost 5).

apiVersion: v1
kind: Namespace
metadata:
  name: local-registry
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-htpasswd
  namespace: local-registry
type: Opaque
stringData:
  # TEST-ONLY CREDENTIAL — not a real secret.
  # Fixed username/password baked into the UAT so the acceptance test
  # (acceptance-tests.md §G6) can create a matching docker-registry pull secret
  # (uatuser / uatpass) without a per-run htpasswd step. The registry it protects
  # only exists for the duration of the UAT and holds a public image under a test
  # tag; the credential never leaves the throwaway VM. Rotate with
  # `htpasswd -Bbn uatuser <newpass>` if you need to.
  # Pragma suppresses false-positive secret scanners (detect-secrets, gitleaks,
  # trufflehog). Quoted flow-style string so the comment is parsed by YAML (a
  # `|` literal block would swallow the pragma as content and break htpasswd).
  htpasswd: "uatuser:$2y$05$oBc4lWKE0vxyBnw4B2xR8.PBa1/4xOXpBO5fcyyDFMxI2Ilcu3v.e\n"  # pragma: allowlist secret, gitleaks:allow, trufflehog:ignore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: local-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: "Registry Realm"
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: local-registry
spec:
  # Fixed ClusterIP so the UAT manifest can bake "10.96.100.100:5000/..." as a
  # stable in-cluster address, same convention as consensus-mock.
  type: ClusterIP
  clusterIP: 10.96.100.100
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
